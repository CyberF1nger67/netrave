# NetRave configuration. The file is read at startup: -config /etc/netrave/config.yaml
# Parameters can be overridden by command-line flags; the settings section is changed by the UI itself.

addr: ":8080"                          # HTTP address of the service
data_dir: /var/lib/netrave             # data root; other paths are derived from it
db_path: /var/lib/netrave/netrave.db   # SQLite: users, permissions, journal
labs_dir: /var/lib/netrave/labs        # lab files and folders: <folder>/<name>.yaml
instances_dir: /var/lib/netrave/instances  # working disks of instance machines
logs_dir: /var/lib/netrave/logs        # server and machine logs
disks_dir: /var/lib/netrave/disks     # disk images and ISOs
icons_dir: /var/lib/netrave/icons      # machine icons
themes_dir: /var/lib/netrave/themes    # UI themes
socket_path: /run/netrave/daemon.sock    # daemon IPC socket (created by systemd RuntimeDirectory)
log_file: /var/log/netrave/netrave.log   # shared log of the daemon and the HTTP process
run_dir: /run/netrave                    # PID, lock and daemon socket
qemu_path: qemu-system-x86_64
restart_sec: 2                         # pause before restarting the child process, seconds
service_name: netrave

# Settings the administrator changes in the UI.
settings:
  session_ttl_hours: 24                # session lifetime, hours
  max_upload_mb: 20480                 # maximum image upload size, MB
  role_admin_description: ""           # administrator role description
