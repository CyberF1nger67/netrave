name: Build

on:
  push:
    branches: [master, main, react-rebuild]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      # The built static files are no longer stored in the repository: the artifact is passed
      # from the frontend build job to the binary build job.
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-static
          path: internal/web/static
          if-no-files-found: error
          include-hidden-files: true

  binaries:
    runs-on: ubuntu-latest
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            goarm: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: frontend-static
          path: internal/web/static
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w \
            -X netrave/internal/version.Version=${GITHUB_REF_NAME} \
            -X netrave/internal/version.Commit=${GITHUB_SHA} \
            -X netrave/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/netrave-linux-${{ matrix.goarch }}${GOARM:+v$GOARM} .
      - uses: actions/upload-artifact@v4
        with:
          name: netrave-linux-${{ matrix.goarch }}${{ matrix.goarm }}
          path: dist/*
